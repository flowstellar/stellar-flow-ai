# Supabase project configuration for the stellar edge functions.
#
# The `project_id` below is the Supabase project that hosts the
# `stellar-send`, `stellar-balance` and `stellar-wallet` functions.
# Contributors forking this repo MUST replace it with the project id
# of their own Supabase project (found in the dashboard under
# Project Settings -> General), otherwise `supabase functions
.# deploy` will target the wrong project.
project_id = "wqdfsqabbzcgtrfbrwtx"
project_id = "wqdfsqabbzcgtrfbrwtx"

[functions.stellar-send]
verify_jwt = true

[functions.stellar-wallet]
verify_jwt = true

[functions.stellar-balance]
verify_jwt = true
# Supabase local dev configuration.
# The project_id is read from the environment so that no live
# project reference is committed to git. Set SUPABASE_PROJECT_ID in your
# shell or .env before running `supabase start`.
project_id = "env(SUPABASE_PROJECT_ID)"
project_id = "wqdfsqabbzcgtrfbrwtx"

# --------------------------------------------------------------------------
# Edge Functions
# -------------------------------------------------------------------------
# verify_jwt is set deliberately per function:
#   - stellar-wallet: public - creates/imports keypairs and funds via #freiendbot; no user session exists yet.
#   - stellar-balance: public - reads only public account data from Horizon.
#   - stellar-send: JWT enforced - signs and submits a transaction with a secret key.

## Function import map (Deno)

[functions.stellar-wallet]
verify_jwt = false
import_map = "deno.json"

[functions.stellar-wallet.limits]
memory_limit_mb = 256
wall_time_limit_sec = 10

[functions.stellar-balance]
verify_jwt = false
import_map = "deno.json"

[functions.stellar-balance.limits]
memory_limit_mb = 256
wall_time_limit_sec = 10

[functions.stellar-send]
verify_jwt = true
import_map = "deno.json"

[functions.stellar-send.limits]
memory_limit_mb = 256
wall_time_limit_sec = 15
