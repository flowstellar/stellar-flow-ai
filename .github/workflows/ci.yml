name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Lint
        run: npm run lint
        timeout-minutes: 5

      - name: Test
        run: npm test -- --run
        timeout-minutes: 5

      - name: Build
        run: npm run build
        timeout-minutes: 10
