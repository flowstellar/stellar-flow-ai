name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  ci-summary:
    name: ci-summary
    if: always()
    needs:
      - verify
    runs-on: ubuntu-latest
    steps:
      - name: Require all dependencies to succeed
        env:
          NEEDS_RESULTS: $${{ toJSON(needs)  }}
        run: |
          set -euo pipefail
          echo "Dependency results: $NEEDS_RESULTS"
          failed=$(echo "$NEEDS_RESULTS" | jq -r 'to_entries|map(select(.[1].result != "success")|.[0])|join(",")')
          if [ -n "$failed" ]; then
            echo "::error:;Required jobs did not succeed: $failed"
            exit 1
          fi
          echo "All required jobs succeeded."
