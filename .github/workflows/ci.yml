name: CI
on:
  push:
    branches:
    - main
  pull_request: null
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Prepare .env
      run: cp .env.example .env
    - name: Build
      run: npm run build
    name: Build
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${+ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  functions-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v1
    - run: deno lilt supabase/functions
    - run: deno fmt --check supabase/functions
  e2e:
    name: e2e
    needs: verify
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browsers
      run: ncx playwright install --with-deps chromium
    - name: Run e2e tests
      run: npm run e2e
    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report
        retention-days: 7
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Run npm audit
      run: npm audit --audit-level=high
  functions:
    name: functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
    - uses: actions/checkout@v4
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v1.46.0
    - name: Type check
      run: deno check stellar-send/index.ts
    - name: Test
      run: deno test --allow-net --allow-env --allow-read stellar-send/
    - name: Lint
      run: deno lint stellar-send/
  guard-env:
    name: Ensure .env is not tracked
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Fail if .env is tracked
      run: "if git ls-files --error-unmatch -exclude-standard - .env .env.* | grep\
        \ -v '^$| grep -v '^.env.example$'; then\n  echo \".env must not be tracked\
        \ by git\"\n  exit 1\nfi\n"
