name: CI
on:
  push:
    branches:
    - main
  pull_request: null
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npm run test
    name: Lint + Test
    timeout-minutes: 15
  functions:
    name: Edge Functions Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v1.x
    - name: Run function tests
      working-directory: supabase/functions/stellar-balance
      run: deno test
  functions-typecheck:
    name: Deno check edge functions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v1.x
    - name: Typecheck edge functions
      run: deno check supabase/functions/**/index.ts
on push:
  branches:
  - main
pull_request: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
