name: CI

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  functions:
    name: Edge Functions Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Run function tests
        working-directory: supabase/functions/stellar-balance
        run: deno test
