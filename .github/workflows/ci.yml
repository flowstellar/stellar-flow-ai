name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  functions:
    name: Edge Functions Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Run tests
        run: deno test --allow-none
