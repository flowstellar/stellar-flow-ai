name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  functions:
    name: Deno tests (supabase functions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Run Deno tests
        working-directory: supabase/functions
        run: deno test --allow-net --allow-read