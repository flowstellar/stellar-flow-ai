name: CI
on:
  push:
    branches:
    - main
  pull_request: null
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: npm ci
      timeout-minutes: 5
    - name: Lint
      run: npm run lint
      timeout-minutes: 5
    - name: Test
      run: npm test -- --run
      timeout-minutes: 5
    - name: Build
      run: npm run build
      timeout-minutes: 10
    name: verify
    timeout-minutes: 15
  functions:
    name: Edge Functions Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v1.x
    - name: Run function tests
      working-directory: supabase/functions/stellar-balance
      run: deno test
on push:
  branches:
  - main
pull_request: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
