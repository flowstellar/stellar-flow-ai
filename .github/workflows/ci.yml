name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for the whole workflow.
# GITHUB_TOKEN is scoped to read-only contents by default.
# If a future job needs to write (e.g. comments, packages, security-events),
# add an explicit job-level `permissions:` block that grants only the additional
# scopes that job requires. Never elevate permissions at the workflow level.
permissions:
  contents: read

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
