name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  env-guard:
    name: Env guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if .env is tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env; then
            echo "::error::.env is tracked by git. Remove it from the repository and add it to .gitignore."
            exit 1
          fi

          tracked_env="$(git ls-files | grep -E '(^|/)\.env(\.|.$|'$)' | grep -v -E '(^|/)\.env.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "::error::Tracked .env* files detected:"
            echo "$tracked_env"
            echo "Only .env.example is allowed to be tracked."
            exit 1
          fi

          echo "Env guard passed."

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
